<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps CI/CD Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            text-align: center;
            padding: 100px 20px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
        }

        h1 {
            color: #00ffcc;
        }

        p {
            font-size: 18px;
        }

        .status {
            color: #00ff99;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>DevOps CI/CD Pipeline</h1>

        <h2>Jenkins + Docker + GitHub + AWS EC2</h2>

        <p>Ứng dụng Flask triển khai tự động bằng CI/CD.</p>

        <p class="status">● Application Running</p>

        <p>Server: AWS EC2</p>
    </div>

</html>
